<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مبروك النجاح 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#d97fa0;
    --rose-deep:#a83e63;
    --plum:#5a1f3d;
    --gold:#cda35a;
    --gold-light:#f2ddaa;
    --gold-deep:#8f6a2a;
    --wine:#5c1230;
    --wine-deep:#3a0a1c;
    --ivory:#faf3e6;
    --frame-radius:20px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    min-height:100%;
    background:
      radial-gradient(ellipse at top, #6d1a3c 0%, #3a0a1c 60%, #240611 100%);
    font-family:'Tajawal',sans-serif;
  }

  body{
    padding:22px 16px 44px;
    display:flex;
    justify-content:center;
  }

  /* ---------- overall composition: one unified certificate card ---------- */
  .showcase{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    position:relative;
    z-index:3;
  }

  /* ---------- video, embedded inside the card as a framed insert ---------- */
  .video-inset{
    position:relative;
    width:88%;
    margin:4px auto 6px;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:#0f0308;
    border:3px solid var(--gold);
    box-shadow:
      0 12px 26px rgba(58,10,28,0.4),
      0 0 0 1px rgba(140,106,42,0.45);
  }
  .video-inset video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#0f0308;
    /* إزالة pointer-events: none للسماح بالتفاعل */
  }

  /* ---------- floating petals / sparkles ---------- */
  .petals{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-40px;
    font-size:20px;
    opacity:0.85;
    animation:fall linear infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35));
  }
  @keyframes fall{
    0%{ transform:translateY(-5vh) translateX(0) rotate(0deg); }
    100%{ transform:translateY(105vh) translateX(var(--drift,20px)) rotate(360deg); }
  }

  /* ---------- surprise seal (opening moment) ---------- */
  .seal-stage{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at center, var(--gold-light) 0%, var(--wine-deep) 120%);
    animation:sealFade 0.9s ease-in-out 1.9s forwards;
  }
  .seal{
    width:120px;
    height:120px;
    border-radius:50%;
    background:linear-gradient(145deg,var(--gold-light),var(--gold) 55%,var(--wine));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
    box-shadow:0 0 0 6px rgba(255,255,255,0.35), 0 20px 50px rgba(58,10,28,0.55);
    animation:sealPulse 1.4s ease-in-out forwards;
  }
  @keyframes sealPulse{
    0%{ transform:scale(0.3); opacity:0; }
    45%{ transform:scale(1.08); opacity:1; }
    65%{ transform:scale(0.96); }
    85%{ transform:scale(1.15); }
    100%{ transform:scale(2.6); opacity:0; }
  }
  @keyframes sealFade{
    0%{ opacity:1; visibility:visible; }
    99%{ opacity:0; visibility:visible;}
    100%{ opacity:0; visibility:hidden; }
  }

  /* ---------- main card (solid, opaque, matches video-frame styling) ---------- */
  .card{
    position:relative;
    width:100%;
    background:linear-gradient(160deg, var(--ivory), #f2e6cf);
    border:1px solid var(--gold);
    border-radius:var(--frame-radius);
    padding:40px 26px 30px;
    text-align:center;
    box-shadow:
      0 20px 45px rgba(0,0,0,0.4),
      0 0 0 6px rgba(250,243,230,0.92),
      0 0 0 7px var(--gold);
    opacity:0;
    transform:scale(0.4) rotate(-4deg);
    animation:cardReveal 1s cubic-bezier(.2,1.4,.4,1) 2.15s forwards;
  }
  @keyframes cardReveal{
    0%{ opacity:0; transform:scale(0.35) rotate(-6deg); }
    60%{ opacity:1; transform:scale(1.04) rotate(1deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .card-inner-frame{
    position:absolute;
    inset:9px;
    border:1px solid rgba(140,106,42,0.55);
    border-radius:13px;
    pointer-events:none;
  }

  .card::before, .card::after{
    content:"❧";
    position:absolute;
    font-size:24px;
    color:var(--gold-deep);
    opacity:0.85;
  }
  .card::before{ top:6px; right:12px; transform:rotate(8deg); }
  .card::after{ bottom:2px; left:12px; transform:rotate(-172deg); }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));
    color:var(--wine-deep);
    font-weight:900;
    font-size:12.5px;
    padding:7px 20px;
    border-radius:4px;
    letter-spacing:0.6px;
    box-shadow:0 8px 18px rgba(143,106,42,0.45);
    clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);
  }

  .headline{
    font-family:'Aref Ruqaa',serif;
    font-size:23px;
    color:var(--wine);
    margin-top:20px;
    line-height:1.5;
    letter-spacing:0.3px;
  }

  .name{
    font-family:'Aref Ruqaa',serif;
    font-size:42px;
    font-weight:700;
    margin-top:4px;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold-light) 35%,var(--gold) 65%,var(--gold-deep));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 2px 18px rgba(205,163,90,0.35);
    padding-bottom:4px;
  }

  .name-flourish{
    color:var(--gold);
    font-size:15px;
    letter-spacing:6px;
    opacity:0.75;
    margin-top:-2px;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:16px 0 14px;
    color:var(--rose);
  }
  .divider span{
    height:1px;
    width:44px;
    background:linear-gradient(90deg,transparent,var(--rose),transparent);
  }

  .cert-type{
    font-size:14.5px;
    color:var(--rose-deep);
    font-weight:500;
  }
  .cert-type b{
    font-weight:900;
    color:var(--plum);
  }

  .score-box{
    margin:24px auto 6px;
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .score-label{
    font-size:11.5px;
    color:var(--wine);
    font-weight:700;
    letter-spacing:2px;
  }
  .score-medal{
    position:relative;
    width:108px;
    height:108px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 35% 30%, var(--wine) 0%, var(--wine-deep) 75%);
    box-shadow:
      0 0 0 3px var(--gold-light),
      0 0 0 5px var(--gold-deep),
      0 12px 26px rgba(58,10,28,0.5);
  }
  .score-medal::before{
    content:"";
    position:absolute;
    inset:9px;
    border-radius:50%;
    border:1px dashed rgba(242,221,170,0.55);
  }
  .score-value{
    font-size:28px;
    font-weight:900;
    color:var(--gold-light);
    text-shadow:0 1px 6px rgba(0,0,0,0.35);
  }

  .quote{
    margin-top:22px;
    font-size:14px;
    line-height:1.95;
    color:var(--wine-deep);
    font-weight:400;
    padding:0 4px;
  }

  .sign{
    margin-top:22px;
    font-size:12px;
    color:var(--gold-deep);
    font-weight:700;
    opacity:0.9;
    letter-spacing:1px;
  }

  @media (max-width:380px){
    .name{ font-size:32px; }
    .headline{ font-size:20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

  <div class="petals" id="petals"></div>

  <div class="seal-stage">
    <div class="seal">🎓</div>
  </div>

  <div class="showcase">

    <div class="card">
      <div class="card-inner-frame"></div>
      <span class="badge">✨ نجاح باهر ✨</span>

      <div class="video-inset">
        <video id="myVideo" autoplay muted loop playsinline disablepictureinpicture
               controlslist="nodownload noplaybackrate nofullscreen"
               src="a.mp4"></video>
      </div>

      <div class="headline">تهانينا يا</div>
      <div class="name">دلال سعد</div>
      <div class="name-flourish">⸙</div>

      <div class="divider"><span></span>🌷<span></span></div>

      <div class="cert-type">أتممتِ بنجاح شهادة <b>البكالوريا</b> 🎓</div>

      <div class="score-box">
        <div class="score-label">المـجـمـوع</div>
        <div class="score-medal">
          <div class="score-value">2358</div>
        </div>
      </div>

      <p class="quote">
        سنة كاملة من السهر والتعب تحوّلت حالياً لتاج فوق راسك، وحلم كان بعيد صار
        اليوم حقيقة تُكتب باسمك. مبروك يا دلال، هالنجاح مش نهاية الطريق،
        هو أول سطر بقصة نجاحك الكبيرة ✨
      </p>

      <div class="sign">بكل فخر   واعتزاز ابو راشد 🌸</div>
    </div>

  </div>

<script>
  // continuous floating petals / sparkles
  const emojis = ['🌸','💗','✨','🎓','🌷'];
  const container = document.getElementById('petals');
  const count = 22;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const left = Math.random()*100;
    const duration = 9 + Math.random()*8;
    const delay = Math.random()*10;
    const drift = (Math.random()*80-40)+'px';
    el.style.left = left+'vw';
    el.style.setProperty('--drift', drift);
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = '-'+delay+'s';
    el.style.fontSize = (14+Math.random()*14)+'px';
    container.appendChild(el);
  }

  // surprise burst of petals/hearts right as the seal opens
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      for(let i=0;i<28;i++){
        const el = document.createElement('div');
        el.className = 'petal';
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left = (40+Math.random()*20)+'vw';
        el.style.top = '40vh';
        el.style.setProperty('--drift', (Math.random()*300-150)+'px');
        el.style.animationDuration = (2.5+Math.random()*2)+'s';
        el.style.animationDelay = '0s';
        el.style.fontSize = (16+Math.random()*16)+'px';
        container.appendChild(el);
        setTimeout(()=>el.remove(), 5000);
      }
    }, 1900);
  });

  // ================== تحسين تشغيل الفيديو ==================
  const video = document.getElementById('myVideo');

  // دالة لتشغيل الفيديو مع إلغاء كتم الصوت
  function playVideoWithSound() {
    // محاولة إلغاء الكتم أولاً
    video.muted = false;
    // محاولة التشغيل، وإذا فشلت بسبب سياسة المتصفح، نعيد التشغيل مع الكتم
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  }

  // دالة لإلغاء الكتم عند أول تفاعل من المستخدم
  function unmuteAndPlay() {
    if (video.muted) {
      video.muted = false;
      video.play().catch(() => {});
    } else {
      // إذا كان الفيديو متوقفاً، نشغله
      if (video.paused) {
        video.play().catch(() => {});
      }
    }
  }

  // عند تحميل الصفحة، نحاول تشغيل الفيديو بصوت
  window.addEventListener('load', playVideoWithSound);
  // أيضاً عند بدء تحميل DOM
  document.addEventListener('DOMContentLoaded', playVideoWithSound);

  // منع توقف الفيديو عند فقدان التركيز أو تغيير التبويب
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
      // إذا عاد المستخدم للتبويب، نتحقق من حالة الفيديو
      if (video.paused) {
        video.play().catch(() => {});
      }
    }
  });

  // عند أي نقرة أو لمسة على الصفحة، نضمن أن الصوت يعمل والفيديو يعمل
  document.addEventListener('click', unmuteAndPlay);
  document.addEventListener('touchstart', unmuteAndPlay);

  // إعادة محاولة التشغيل إذا توقف الفيديو فجأة
  video.addEventListener('pause', function() {
    // إذا كان التوقف ليس بسبب المستخدم (مثل فقدان البيانات)، نعيد التشغيل
    // نتحقق إذا كان الفيديو لا يزال يحتوي على بيانات ولم ينتهِ
    if (!video.ended && video.readyState >= 2) {
      video.play().catch(() => {});
    }
  });

  // إذا حدث خطأ في التحميل، نحاول إعادة التحميل
  video.addEventListener('error', function() {
    setTimeout(() => {
      video.load();
      video.play().catch(() => {});
    }, 500);
  });

  console.log('تم تحسين تشغيل الفيديو بنجاح ✅');
</script>

</body>
</html>
